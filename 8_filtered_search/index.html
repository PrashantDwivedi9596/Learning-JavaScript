<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-[#0e0e0e] text-white min-h-screen py-10 px-4">
    <div class="max-w-7xl mx-auto flex flex-col items-center gap-8">
      <!-- Search & Title -->
      <header
        class="w-full max-w-md flex flex-col items-center gap-4 text-center"
      >
        <h1 class="text-3xl font-bold tracking-tight">Explore Users</h1>
        <input
          type="text"
          id="searchInput"
          placeholder="Search users..."
          class="w-full px-5 py-3 rounded-xl bg-[#1a1a1a] border border-[#2a2a2a] text-sm text-gray-200 outline-none focus:border-blue-500"
          autocomplete="off"
        />
      </header>

      <div class="notFound"></div>

      <!-- Grid Target -->
      <main
        id="cardsContainer"
        class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 justify-items-center"
      ></main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
