<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Timer Class</title>
  </head>
  <body>
    <div id="container">
      <h1 id="text">Download</h1>
      <div class="progress" id="progress">
        <div id="progress-bar" class="progress"></div>
      </div>
      <h3 id="percent">0%</h3>
      <button id="download">Download</button>
    </div>

    <div id="alert">
      <h2>You Have Downloaded the file</h2>
      <div id="alert-progress">
        <div id="alert-progressbar"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
