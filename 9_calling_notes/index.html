<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="style.css"><title>Calling Notes</title></head>
<body data-view="stack">
  <nav class="app-nav"><a class="brand" href="#main"><i class="fa-solid fa-phone-volume"></i> Calling Notes</a><button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button><div class="nav-controls"><div class="view-switcher"><button class="view-btn active" type="button" data-view="stack"><i class="fa-solid fa-layer-group"></i> Stack</button><button class="view-btn" type="button" data-view="grid"><i class="fa-solid fa-table-cells-large"></i> Grid</button></div><label class="priority-filter" for="priority-filter">Priority<select id="priority-filter"><option value="all">All priorities</option><option value="emergency">Emergency</option><option value="important">Important</option><option value="urgent">Urgent</option><option value="norush">No rush</option></select></label><button class="theme-toggle" type="button" aria-label="Switch theme"><i class="fa-solid fa-moon"></i> Theme</button></div></nav>
  <main id="main"><aside id="button-container"><button class="control-btn add" type="button" aria-label="Add note"><i class="fa-solid fa-plus"></i></button><button class="control-btn up" type="button" aria-label="Next card"><i class="fa-solid fa-chevron-up"></i></button><button class="control-btn down" type="button" aria-label="Previous card"><i class="fa-solid fa-chevron-down"></i></button><button class="control-btn delete" type="button" aria-label="Delete selected card"><i class="fa-solid fa-trash"></i></button></aside><section class="content-area" aria-live="polite"><div class="view-heading"><h1>Your calls</h1><p class="card-count"></p></div><div class="cards-container"></div><p class="empty-state" hidden>No calling notes match this priority.</p></section></main>
  <div class="form-container" aria-hidden="true"><form id="callForm" novalidate><div class="form-title-bar"><h2>New call</h2><button type="button" class="close close-icon-btn" aria-label="Close">&times;</button></div><div class="form-header"><button type="button" class="tab-btn active" data-tab="client">Client</button><button type="button" class="tab-btn" data-tab="contact">Contact</button></div><section class="form-section client active"><div class="input-group"><label for="imageurl">Image URL</label><input type="url" id="imageurl" required></div><div class="input-group"><label for="fullname">Full name</label><input id="fullname" required></div><div class="input-group"><label for="hometown">Home town</label><input id="hometown" required></div><div class="input-group"><label for="purpose">Purpose</label><input id="purpose" required></div><div class="input-group"><label for="category">Priority</label><select id="category"><option value="emergency">Emergency</option><option value="important">Important</option><option value="urgent" selected>Urgent</option><option value="norush">No rush</option></select></div></section><section class="form-section contact"><div class="input-group"><label for="mobile-no">Mobile number</label><input type="tel" id="mobile-no" required></div><div class="input-group"><label for="email-address">Email address</label><input type="email" id="email-address"></div><div class="input-group"><label for="whatsapp-no">WhatsApp number</label><input type="tel" id="whatsapp-no"></div><div class="input-group"><label for="linkedIn-id">LinkedIn handle or URL</label><input id="linkedIn-id"></div><div class="input-group"><label for="instagram-handle">Instagram handle</label><input id="instagram-handle"></div><div class="input-group"><label for="x-handle">X handle</label><input id="x-handle"></div></section><p id="error-message" role="alert"></p><div class="form-actions"><button type="button" class="btn close">Cancel</button><button type="button" class="btn btn-primary next-section">Next</button><button type="submit" class="btn btn-success create-note" hidden>Create note</button></div></form></div>
  <script src="script.js"></script>
</body></html>
